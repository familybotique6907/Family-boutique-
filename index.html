<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d81b60">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Family Boutique And Cloth House</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<header>
  <div class="logo" id="logo">👗</div>
  <div class="brand">Family Boutique</div>
  <input id="q" type="search" placeholder="Search suits…">
  <button class="ham" id="ham" aria-label="Menu">☰</button>
</header>
<section id="bn"></section>
<main id="main">
  <div style="padding: 40px; text-align: center; color: #d81b60;">
    <h3>Loading collection...</h3>
  </div>
</main>
<footer id="ft"></footer>
<div class="modal" id="m"><div class="box"><button class="x" id="mx">✕</button><div id="mb"></div></div></div>

<script>
let FB={"apiKey":"AIzaSyAPQ0o3DG9_w3jcYznggznHfhDRTF80bf0","authDomain":"family-boutique-a0f3c.firebaseapp.com","databaseURL":"https://family-boutique-a0f3c-default-rtdb.firebaseio.com","projectId":"family-boutique-a0f3c","appId":"1:287157543231:web:234acab01b70688a25b38a"};
let db = null;
try {
  if (typeof firebase !== 'undefined' && FB.databaseURL) {
    firebase.initializeApp(FB);
    db = firebase.database().ref('familyboutique');
  }
} catch(e) { console.warn(e); }

const S = {
  products: JSON.parse(localStorage.getItem('fb_products') || '[]'),
  cats: JSON.parse(localStorage.getItem('fb_cats') || JSON.stringify([{id:'coord',name:'✨ Co-ord Sets'},{id:'stitched',name:'👗 Stitched Suits'},{id:'unstitched',name:'🧵 Unstitched Collection'}])),
  set: JSON.parse(localStorage.getItem('fb_settings') || '{"open":true,"pass":"6907"}'),
  bn: JSON.parse(localStorage.getItem('fb_banner') || '{}'),
  cart: JSON.parse(localStorage.getItem('fb_cart') || '{}'),
  fav: JSON.parse(localStorage.getItem('fb_fav') || '[]'),
  q: ''
};

const $ = s => document.querySelector(s);
const rs = n => 'Rs ' + Number(n || 0).toLocaleString();
const PH = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect fill="#fce4ec" width="300" height="400"/><text x="150" y="210" font-size="60" text-anchor="middle">👗</text></svg>');

if (db) {
  db.child('products').on('value', s => {
    S.products = Object.values(s.val() || {});
    localStorage.setItem('fb_products', JSON.stringify(S.products));
    render();
  });
  db.child('categories').on('value', s => {
    const val = s.val();
    if(val) {
      S.cats = Object.values(val);
      localStorage.setItem('fb_cats', JSON.stringify(S.cats));
      render();
    }
  });
  db.child('banner').on('value', s => {
    S.bn = s.val() || {};
    localStorage.setItem('fb_banner', JSON.stringify(S.bn));
    render();
  });
  db.child('settings').on('value', s => {
    if(s.val()) {
      S.set = {...S.set, ...s.val()};
      localStorage.setItem('fb_settings', JSON.stringify(S.set));
      render();
    }
  });
}

function card(p) {
  return `<div class="card" data-id="${p.id}"><div class="im"><img loading="lazy" src="${(p.imgs||[])[0]||PH}" alt="">
  <span class="bdg">${p.cat}</span></div>
  <h4>${p.title}</h4><b>${rs(p.price)}</b>
  <button class="btn" data-c="${p.id}">Add to Cart</button></div>`;
}

function render() {
  try {
    const b = S.bn || {};
    const im = b.img || '';
    $('#bn').innerHTML = `<div class="banner" ${im ? `style="background-image:url('${im}')"` : ''}><div><h2>${b.head || 'Welcome to Family Boutique'}</h2>${b.offer ? `<p>${b.offer}</p>` : ''}</div></div>`;
    
    const q = (S.q || '').toLowerCase();
    const list = S.products.filter(p => !q || (p.title + ' ' + p.cat).toLowerCase().includes(q));
    
    let h = '';
    S.cats.forEach(c => {
      const items = list.filter(p => p.cat === c.id);
      if(items.length > 0) {
        h += `<h2 class="t">${c.name}</h2><div class="row">${items.map(card).join('')}</div>`;
      }
    });
    
    if(!h) {
      h = `<div style="padding: 40px; text-align: center;"><h3 style="color: #d81b60;">Explore Our Collection</h3><p>Upload items from your Admin Panel to display them here.</p></div>`;
    }
    $('#main').innerHTML = h;
    $('#ft').innerHTML = `<div class="fbox"><h3>Family Boutique And Cloth House</h3><p>📍 ${S.set.addr || 'Main Market'}</p><p>📞 ${S.set.phone || '0300 1234567'}</p></div><p class="cp">© ${new Date().getFullYear()} Family Boutique And Cloth House</p>`;
  } catch(err) {
    console.error(err);
  }
}

function openM(html) { $('#mb').innerHTML = html; $('#m').classList.add('on'); $('#mx').style.display = 'block'; }
function closeM() { $('#m').classList.remove('on'); }
$('#mx').onclick = closeM; $('#m').onclick = e => { if(e.target.id === 'm') closeM(); };

function menu() {
  openM(`<div class="menu"><h3 style="color:#d81b60">Menu</h3>
  <a onclick="closeM(); location.href='admin.html'">🔐 Admin Panel</a>
  <a target="_blank" href="https://wa.me/92${(S.set.wa||'3001234567').replace(/\D/g,'')}">💬 Order on WhatsApp</a>
  <a onclick="closeM(); openM('<h3>Cart</h3><p>Cart items will appear here.</p>')">🛒 Cart</a></div>`);
}

document.addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'ham') { menu(); }
  if(t.dataset.c) { alert('Added to cart!'); }
});

$('#q').oninput = e => { S.q = e.target.value; render(); };
$('#logo').onclick = () => scrollTo({top:0, behavior:'smooth'});

render();
</script>
</body>
</html>
