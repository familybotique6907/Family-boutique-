<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d81b60">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://family-boutique-a0f3c-default-rtdb.firebaseio.com" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Boutique">
<title>Family Boutique And Cloth House</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head><body>
<header>
  <div class="logo" id="logo">👗</div>
  <div class="brand">Family Boutique</div>
  <input id="q" type="search" placeholder="Search suits…">
  <button class="ham" id="ham" aria-label="Menu">☰</button>
</header>
<div id="net" hidden style="background:#fff3cd;color:#664d03;text-align:center;font-size:12px;padding:4px">Offline - reconnecting…</div>
<section id="bn"></section>
<main id="main"><p style="padding:30px;text-align:center;color:#8a5568">Loading…</p></main>
<footer id="ft"></footer>
<div class="modal" id="m"><div class="box"><button class="x" id="mx">✕</button><div id="mb"></div></div></div>
<div class="closed" id="closed" style="display:none"><div><div style="font-size:54px">🌸</div>
<h1>Store Temporarily Closed</h1><p style="margin-top:8px">We'll be back shortly. Thank you for your patience.</p></div></div>

<script>
/* ===== Safe helpers: a missing element can never crash the script ===== */
const $=s=>document.querySelector(s)||document.createElement('input');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const imgSrc=u=>/^(https?:\/\/|data:image\/)/i.test(u||'')?esc(u):'';
const rs=n=>'Rs '+Number(n||0).toLocaleString();
const toast=t=>{try{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)}catch{}};
const W=(p,ms=12000)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
const guard=f=>function(){try{return f.apply(this,arguments)}catch(e){console.error(f.name,e)}};

/* ===== Session: a tiny {name,mobile,joined} record (~100 bytes) so the customer stays logged in. All real data lives in Firebase ===== */
const SK='fb_session';
const getSession=()=>{try{return JSON.parse(localStorage.getItem(SK))||null}catch{return null}};
const setSession=u=>{try{u?localStorage.setItem(SK,JSON.stringify({name:u.name,mobile:u.mobile,joined:u.joined||''})):localStorage.removeItem(SK)}catch{}};
let savedUser=getSession();
try{
  if(!savedUser){const m=localStorage.getItem('fb_mobile')||((JSON.parse(localStorage.getItem('fb_user'))||{}).mobile);if(m)savedUser={name:'',mobile:m,joined:''}} /* migrate older versions */
  /* one-time cleanup of old heavy keys that filled the browser */
  ['fb_products','fb_users','fb_orders','fb_settings','fb_cats','fb_banner','fb_config','fb_cart','fb_fav','fb_user','fb_mobile'].forEach(k=>localStorage.removeItem(k));
  if(savedUser)setSession(savedUser);
}catch{}

/* ===== Firebase (single source of truth) ===== */
const FB={"apiKey":"AIzaSyAPQ0o3DG9_w3jcYznggznHfhDRTF80bf0","authDomain":"family-boutique-a0f3c.firebaseapp.com","databaseURL":"https://family-boutique-a0f3c-default-rtdb.firebaseio.com","projectId":"family-boutique-a0f3c","appId":"1:287157543231:web:234acab01b70688a25b38a"};
let db=null;
try{firebase.initializeApp(FB);db=firebase.database().ref('familyboutique')}catch(e){console.warn('Firebase failed',e)}

/* ===== State (memory only, filled from Firebase) ===== */
const DEF=[{id:'coord',name:'✨ Co-ord Sets'},{id:'stitched',name:'👗 Stitched Suits'},{id:'unstitched',name:'🧵 Unstitched Collection'}];
const S={products:[],set:{open:true},user:null,cart:{},fav:[],cats:DEF,bn:{},cat:'all',q:'',ready:false,err:''};
const imgCache={};let online=false,synced=false;
const byId=id=>S.products.find(p=>p.id===id);
const catName=id=>(S.cats.find(c=>c.id===id)||{}).name||id;
const objList=(snap,key)=>{const v=snap.val()||{};return Object.keys(v).filter(k=>v[k]&&typeof v[k]==='object').map(k=>({...v[k],[key]:v[k][key]||k}))};
const normProduct=p=>({...p,imgs:Object.values(p.imgs||{}),colors:Object.values(p.colors||{})});
const thumbOf=p=>p.thumb||(p.imgs&&p.imgs[0])||'';

/* ===== Helpers ===== */
const waNum=()=>{let n=String(S.set.wa||'').replace(/\D/g,'');return n.startsWith('0')?'92'+n.slice(1):n};
const waLink=t=>`https://wa.me/${waNum()}?text=${encodeURIComponent(t)}`;
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect fill="#fce4ec" width="300" height="400"/><text x="150" y="210" font-size="60" text-anchor="middle">👗</text></svg>');

/* ===== Rendering ===== */
function card(p){
  const col=(p.colors||[]).slice(0,3).join(', ');
  return `<div class="card" data-id="${esc(p.id)}"><div class="im"><img loading="lazy" decoding="async" src="${imgSrc(thumbOf(p))||PH}" alt="">
  <span class="bdg">${esc(catName(p.cat))}</span>${p.sold?'<span class="so">Sold Out</span>':''}${p.old>p.price?'<span class="so" style="top:32px;bottom:auto;background:#d81b60">SALE</span>':''}
  <button class="fv ${S.fav.includes(p.id)?'on':''}" data-f="${esc(p.id)}">♥</button></div>
  <h4>${esc(p.title)}</h4><div class="pr"><b>${rs(p.price)}</b>${p.old>p.price?`<s>${rs(p.old)}</s>`:''}</div><small>${col?'🎨 '+esc(col):'&nbsp;'}</small>
  <button class="btn" data-c="${esc(p.id)}" ${p.sold?'disabled style="opacity:.5"':''}>Add to Cart</button></div>`;
}
const renderBanner=guard(function renderBanner(){
  $('#closed').style.display=S.set.open===false?'grid':'none';
  const b=S.bn||{},img=imgSrc(b.img);
  $('#bn').innerHTML=`<div class="banner" ${img?`style="background-image:url('${img}')"`:''}><div><h2>${esc(b.head||'Welcome to Family Boutique')}</h2>${b.offer?`<p>${esc(b.offer)}</p>`:''}</div></div>`;
});
const renderMain=guard(function renderMain(){
  if(!S.ready){
    $('#main').innerHTML=S.err?`<p style="padding:30px;text-align:center;color:#b71c1c">${esc(S.err)}<br><br><button class="btn" onclick="location.reload()">Retry</button></p>`:'<p style="padding:30px;text-align:center;color:#8a5568">Loading…</p>';
    return;
  }
  const q=S.q.toLowerCase();
  const list=S.products.filter(p=>!q||((p.title||'')+' '+catName(p.cat)+' '+(p.colors||[]).join(' ')).toLowerCase().includes(q));
  let h=`<div class="chips">${[{id:'all',name:'All'},...S.cats].map(c=>`<span class="chip ${S.cat===c.id?'on':''}" data-cat="${esc(c.id)}">${esc(c.name)}</span>`).join('')}</div>`;
  let any=false;
  S.cats.forEach(c=>{
    if(S.cat!=='all'&&S.cat!==c.id)return;
    const items=list.filter(p=>p.cat===c.id);if(!items.length)return;any=true;
    h+=`<h2 class="t">${esc(c.name)}</h2><div class="row">${items.map(card).join('')}</div>`;
  });
  if(!any)h+='<p style="padding:30px;text-align:center;color:#8a5568">No items found.</p>';
  $('#main').innerHTML=h;
});
const renderFoot=guard(function renderFoot(){
  const s=S.set,soc=[['tt','TikTok','♪'],['fb','Facebook','f'],['ig','Instagram','◎']].filter(x=>safe(s[x[0]]));
  $('#ft').innerHTML=`<div class="fbox"><h3>Family Boutique And Cloth House</h3>${s.desc?`<p>${esc(s.desc)}</p>`:''}
  ${s.addr?`<p>📍 ${esc(s.addr)}</p>`:''}${s.phone?`<p>📞 <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></p>`:''}${s.email?`<p>✉️ <a href="mailto:${esc(s.email)}">${esc(s.email)}</a></p>`:''}
  ${soc.length?`<div class="socs">${soc.map(x=>`<a class="soc" title="${x[1]}" target="_blank" rel="noopener" href="${safe(s[x[0]])}">${x[2]}</a>`).join('')}</div>`:''}</div>
  <p class="cp">© ${new Date().getFullYear()} Family Boutique And Cloth House</p>`;
});
const renderAll=()=>{renderBanner();renderMain();renderFoot()};

/* ===== Live Firebase listeners (one connection; renders are coalesced so a burst of events paints once) ===== */
let rq=0;
const schedule=()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;renderAll()})};
const showNet=()=>{$('#net').hidden=online||!S.ready};
function listenAll(){
  if(!db)return;
  const bad=e=>{console.warn(e);if(!S.ready){S.err='Server se connect nahi ho paya ('+(e&&e.message||'error')+').';renderMain()}};
  firebase.database().ref('.info/connected').on('value',s=>{
    online=!!s.val();showNet();
    if(online&&S.user&&!synced)syncUser(); /* retried automatically whenever the connection comes back */
  });
  db.child('products').on('value',s=>{S.products=objList(s,'id').map(normProduct).sort((a,b)=>(b.created||0)-(a.created||0));S.ready=true;S.err='';showNet();schedule()},bad);
  db.child('settings').on('value',s=>{const v=s.val()||{};delete v.pass;S.set={open:true,...v};schedule()},bad);
  db.child('categories').on('value',s=>{const v=objList(s,'id').sort((a,b)=>(a.order||0)-(b.order||0));S.cats=v.length?v:DEF;schedule()},bad);
  db.child('banner').on('value',s=>{S.bn=s.val()||{};schedule()},bad);
  setTimeout(()=>{if(!S.ready){S.err='Internet slow hai ya server tak nahi pahunch pa rahe. Dobara try karein.';renderMain()}},15000);
}

/* ===== Modal system ===== */
function openM(html,lock){$('#mb').innerHTML=html;$('#m').classList.add('on');$('#m').dataset.lock=lock?1:'';$('#mx').style.display=lock?'none':'block'}
function closeM(){if($('#m').dataset.lock)return;$('#m').classList.remove('on')}
$('#mx').onclick=closeM;$('#m').onclick=e=>{if(e.target.id==='m')closeM()};

function product(id){
  const p=byId(id);if(!p)return;
  const rel=S.products.filter(x=>x.cat===p.cat&&x.id!==id).slice(0,6);
  const full=p.imgs.length?p.imgs:(imgCache[id]||null);
  const sl=l=>(l.length?l:[PH]).map(i=>`<img src="${imgSrc(i)||PH}" alt="">`).join('');
  openM(`<h3 style="margin-bottom:4px;color:#d81b60">${esc(p.title)}</h3>
  <div class="slider" data-pid="${esc(id)}">${sl(full||[thumbOf(p)].filter(Boolean))}</div>
  <div class="price">${rs(p.price)}</div>
  <p>${p.sold?'❌ Sold Out':'✅ In Stock'} · 🎨 ${esc((p.colors||[]).join(', '))}</p>
  <p style="margin:8px 0;white-space:pre-line">${esc(p.desc)}</p>
  <button class="btn full" data-c="${esc(id)}" ${p.sold?'disabled':''}>🛒 Add to Cart</button>
  <button class="btn alt full" data-f="${esc(id)}">${S.fav.includes(id)?'♥ Remove Favorite':'♡ Add to Favorites'}</button>
  <a class="btn wa full" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" data-ord="p:${esc(id)}" href="${waLink(`Hello! I want to order: ${p.title} (${rs(p.price)})`)}">Order via WhatsApp</a>
  ${rel.length?`<h3 style="margin:16px 0 0;color:#d81b60">Similar Suits</h3><div class="row" style="padding:8px 0">${rel.map(card).join('')}</div>`:''}`);
  /* Full-size photos are fetched only when a product is opened (once, then cached in memory) */
  if(!full&&db){
    db.child('productImages/'+id).once('value').then(s=>{
      const l=Object.values(s.val()||{});imgCache[id]=l;
      const el=document.querySelector('.slider[data-pid="'+id+'"]');
      if(el&&l.length)el.innerHTML=sl(l);
    }).catch(()=>{});
  }
}
function cart(){
  const ids=Object.keys(S.cart).filter(id=>byId(id));let tot=0,msg='Hello! I want to order:\n';
  const rows=ids.map(id=>{const p=byId(id),n=S.cart[id];tot+=p.price*n;msg+=`• ${p.title} x${n} = ${rs(p.price*n)}\n`;
    return `<div class="line"><img src="${imgSrc(thumbOf(p))||PH}"><div>${esc(p.title)}<br><b>${rs(p.price)}</b></div>
    <button class="btn alt" data-q="${esc(id)}:-1">−</button>${n}<button class="btn alt" data-q="${esc(id)}:1">+</button></div>`}).join('');
  msg+=`Total: ${rs(tot)}`+(S.user?`\nName: ${S.user.name}\nMobile: ${S.user.mobile}`:'');
  openM(`<h3 style="color:#d81b60">🛒 Your Cart</h3>${rows||'<p style="padding:20px;text-align:center">Cart is empty</p>'}
  ${rows?`<div class="price" style="margin:10px 0">Total: ${rs(tot)}</div><a class="btn wa full" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" data-ord="cart" href="${waLink(msg)}">Checkout via WhatsApp</a>`:''}`);
}
function favs(){const l=S.products.filter(p=>S.fav.includes(p.id));
  openM(`<h3 style="color:#d81b60">❤️ Favorites</h3>${l.length?`<div class="grid" style="padding:8px 0">${l.map(card).join('')}</div>`:'<p style="padding:20px;text-align:center">No favorites yet</p>'}`)}
function profile(){if(!S.user)return login();openM(`<h3 style="color:#d81b60">My Profile</h3><p style="margin:10px 0">👤 ${esc(S.user.name)}<br>📱 ${esc(S.user.mobile)}</p><button class="btn full" id="lo">Logout</button>`)}
function help(){const s=S.set;openM(`<h3 style="color:#d81b60">Help & Support</h3><p style="white-space:pre-line;margin:8px 0">${esc(s.desc)}\n📞 ${esc(s.phone)}\n✉️ ${esc(s.email)}\n📍 ${esc(s.addr)}</p>
  <a class="btn wa full" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${waLink('Hello! I need help.')}">Chat on WhatsApp</a>`)}
function admin(){openM(`<h3 style="color:#d81b60">Family Boutique Admin</h3><input id="pw" type="password" placeholder="Admin password"><p id="pe" style="color:#d81b60"></p><button class="btn full" id="ap">Enter</button>`)}
function menu(){openM(`<div class="menu"><h3 style="color:#d81b60">Menu</h3>
  <a data-go="all">All Collections</a>${S.cats.map(c=>`<a data-go="${esc(c.id)}">${esc(c.name)}</a>`).join('')}
  <a data-v="cart">🛒 Cart (${Object.values(S.cart).reduce((a,b)=>a+b,0)})</a><a data-v="favs">❤️ Favorites</a><a data-v="profile">👤 Profile</a>
  <a target="_blank" rel="noopener" href="${waLink('Hello! I want to place an order.')}">💬 Order Now on WhatsApp</a><a data-v="help">Help / Support</a><a data-v="install">📲 Add to Home Screen</a><a data-v="admin">🔐 Family Boutique Admin</a></div>`)}

/* ===== Admin password check (password is read from Firebase, never kept in page state) ===== */
async function tryAdmin(){
  const pw=$('#pw').value;
  if(!db){$('#pe').textContent='Server se connect nahi hua';return}
  $('#pe').textContent='Checking…';
  try{
    const s=await W(db.child('settings/pass').once('value'),8000);
    if(pw===String(s.val()||'6907')){try{sessionStorage.setItem('fb_admin','1')}catch{}location.href='admin.html'}
    else $('#pe').textContent='Wrong password';
  }catch{$('#pe').textContent='Connection error, dobara try karein'}
}

/* ===== Login: instant and optimistic. The customer is let in at once; Firebase sync happens in the background ===== */
function login(msg){openM(`<h3 style="color:#d81b60">Welcome 🌸</h3><p>Sign in to continue</p>
  <input id="ln" placeholder="Your name"><input id="lm" type="tel" placeholder="03XXXXXXXXX"><p id="le" style="color:#d81b60;font-size:13px">${esc(msg||'')}</p>
  <button class="btn full" id="lg">Continue</button>`,true)}
function doLogin(){
  const name=$('#ln').value.trim(),raw=$('#lm').value.replace(/[\s-]/g,'');
  const m=raw.match(/^(?:\+?92|0)(3\d{9})$/);
  if(name.length<2||!m){$('#le').textContent='Enter your name and a valid mobile (03XXXXXXXXX).';return}
  S.user={name,mobile:'0'+m[1],joined:''};setSession(S.user);synced=false;
  $('#m').dataset.lock='';closeM();renderMain();
  if(db)db.child('users/'+S.user.mobile).update({name:S.user.name,mobile:S.user.mobile}).catch(console.warn);
  if(online)syncUser();
}
/* One read per session: fetch joined date + saved cart/favorites, merge with anything added meanwhile */
async function syncUser(){
  if(!db||!S.user||synced)return;
  const mobile=S.user.mobile;synced=true;
  try{
    const u=(await W(db.child('users/'+mobile).once('value'),20000)).val()||{};
    if(!S.user||S.user.mobile!==mobile)return;
    const up={};
    if(u.name&&!S.user.name)S.user.name=u.name;
    if(u.joined)S.user.joined=u.joined;else{S.user.joined=new Date().toISOString();up.joined=S.user.joined}
    if(!u.name&&S.user.name){up.name=S.user.name;up.mobile=mobile}
    setSession(S.user);
    const sc=(u.cart&&typeof u.cart==='object')?u.cart:{};
    Object.keys(sc).forEach(k=>{if(!(k in S.cart))S.cart[k]=sc[k]});
    S.fav=[...new Set([...Object.values(u.fav||{}),...S.fav])];
    if(Object.keys(up).length)db.child('users/'+mobile).update(up).catch(console.warn);
    renderMain();
  }catch{synced=false} /* will retry when the connection is re-established */
}

/* ===== Cart / favorites: kept in memory, written to Firebase in one batched update ===== */
let dirty={},saveTm=null;
function flush(){
  clearTimeout(saveTm);saveTm=null;
  if(!db||!S.user||!Object.keys(dirty).length)return;
  const u={};
  if(dirty.cart)u.cart=Object.keys(S.cart).length?S.cart:null;
  if(dirty.fav)u.fav=S.fav.length?S.fav:null;
  dirty={};
  db.child('users/'+S.user.mobile).update(u).catch(console.warn);
}
const queueSave=k=>{dirty[k]=1;clearTimeout(saveTm);saveTm=setTimeout(flush,800)};
const saveCart=()=>queueSave('cart'),saveFav=()=>queueSave('fav');
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ===== Order requests -> Firebase orders, then WhatsApp opens ===== */
function logOrder(k){
  if(!db)return;
  let items=[],total=0;
  if(k==='cart'){Object.keys(S.cart).forEach(id=>{const p=byId(id);if(p){items.push({t:p.title,n:S.cart[id],pr:p.price});total+=p.price*S.cart[id]}})}
  else{const p=byId(k.slice(2));if(p){items=[{t:p.title,n:1,pr:p.price}];total=p.price}}
  if(!items.length)return;
  const o={id:'o'+Date.now(),items,total,name:(S.user&&S.user.name)||'',mobile:(S.user&&S.user.mobile)||'',ts:Date.now(),status:'new',src:k==='cart'?'cart':'product'};
  db.child('orders/'+o.id).set(o).catch(console.warn);
}

/* ===== Add to Home Screen (PWA install) ===== */
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
addEventListener('appinstalled',()=>{dip=null;toast('Installed 🎉')});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function install(){
  if(standalone())return openM('<h3 style="color:#d81b60">Already installed ✅</h3><p style="margin-top:8px">Family Boutique is on your home screen.</p>');
  if(dip){const p=dip;dip=null;p.prompt();p.userChoice.then(()=>closeM()).catch(()=>{});return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  openM(`<h3 style="color:#d81b60">📲 Add to Home Screen</h3>`+(ios
   ?`<ol class="how"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow) at the bottom.</li><li>Scroll and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>`
   :`<ol class="how"><li>Open the browser menu <b>⋮</b> (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Confirm with <b>Install</b>.</li></ol><p style="font-size:12px;color:#8a5568">On desktop, use the install icon in the address bar.</p>`));
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ===== Events ===== */
document.addEventListener('click',e=>{
  try{
    const t=e.target instanceof Element?e.target:null;if(!t)return;
    const g=a=>t.closest(`[${a}]`);let el;
    const od=g('data-ord');if(od)logOrder(od.dataset.ord);
    if(el=g('data-f')){const id=el.dataset.f;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];saveFav();
      const h=$('#mb').querySelector('h3');
      if($('#m').classList.contains('on')&&h&&h.textContent==='❤️ Favorites')favs();else renderMain();
      if(el.classList.contains('btn'))product(id);return}
    if(el=g('data-c')){const id=el.dataset.c;S.cart[id]=(S.cart[id]||0)+1;saveCart();toast('Added to cart 🛒');return}
    if(el=g('data-q')){const[id,d]=el.dataset.q.split(':');S.cart[id]=(S.cart[id]||0)+Number(d);if(S.cart[id]<=0)delete S.cart[id];saveCart();cart();return}
    if(el=g('data-go')){S.cat=el.dataset.go;closeM();renderMain();return}
    if(el=g('data-cat')){S.cat=el.dataset.cat;renderMain();return}
    if(el=g('data-v')){const f=({cart,favs,profile,help,admin,install})[el.dataset.v];if(f)f();return}
    if(el=t.closest('.card')){product(el.dataset.id);return}
    if(t.id==='lg')doLogin();
    if(t.id==='lo'){flush();setSession(null);S.user=null;S.cart={};S.fav=[];synced=false;renderMain();login()}
    if(t.id==='ap')tryAdmin();
  }catch(err){console.error(err)}
});
$('#ham').onclick=menu;
let qt=null;
$('#q').oninput=e=>{const v=e.target.value;clearTimeout(qt);qt=setTimeout(()=>{S.q=v;renderMain()},150)};
$('#logo').onclick=()=>scrollTo({top:0,behavior:'smooth'});
window.addEventListener('error',e=>console.warn('Script error:',e.message));

/* ===== Init: a saved session opens the store instantly, with no network wait and no login screen ===== */
(function init(){
  renderAll();
  if(!db){S.err='Firebase load nahi hua. Internet check karein.';renderMain();return}
  if(savedUser&&savedUser.mobile){S.user={name:savedUser.name||'',mobile:savedUser.mobile,joined:savedUser.joined||''}}
  listenAll();
  if(!S.user)login();
})();
</script>
