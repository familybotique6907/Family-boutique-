<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d81b60">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Boutique">
<title>Family Boutique And Cloth House</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head><body>
<header>
  <div class="logo" id="logo">👗</div>
  <div class="brand">Family Boutique</div>
  <input id="q" type="search" placeholder="Search suits…">
  <button class="ham" id="ham" aria-label="Menu">☰</button>
</header>
<section id="bn"></section>
<main id="main"></main>
<footer id="ft"></footer>
<div class="modal" id="m"><div class="box"><button class="x" id="mx">✕</button><div id="mb"></div></div></div>
<div class="closed" id="closed" style="display:none"><div><div style="font-size:54px">🌸</div>
<h1>Store Temporarily Closed</h1><p style="margin-top:8px">We'll be back shortly. Thank you for your patience.</p></div></div>

<script>
let FB={apiKey:"AIzaSyAPQ0o3DG9_w3jcYznggznHfhDRTF80bf0",authDomain:"family-boutique-a0f3c.firebaseapp.com",databaseURL:"https://family-boutique-a0f3c-default-rtdb.firebaseio.com",projectId:"family-boutique-a0f3c",appId:"1:287157543231:web:234acab01b70688a25b38a"};
try{FB=JSON.parse(localStorage.getItem("fb_config"))||FB}catch{}

const ls=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const $=s=>document.querySelector(s);
let db=null;
try{if(FB.databaseURL&&typeof firebase!=='undefined'){firebase.initializeApp(FB);db=firebase.database().ref('familyboutique')}}catch(e){}

const DEF=[{id:'coord',name:'✨ Co-ord Sets'},{id:'stitched',name:'👗 Stitched Suits'},{id:'unstitched',name:'🧵 Unstitched Collection'}];
const S={products:ls('fb_products',[]),set:ls('fb_settings',{open:true,pass:'6907'}),user:ls('fb_user',null),cart:ls('fb_cart',{}),
 fav:ls('fb_fav',[]),cats:ls('fb_cats',null)||DEF,bn:ls('fb_banner',{}),cat:'all',q:''};
const byId=id=>S.products.find(p=>p.id===id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const catName=id=>(S.cats.find(c=>c.id===id)||{}).name||id;
const toast=t=>{try{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)}catch{}};

if(db){
  db.child('products').on('value',s=>{try{S.products=Object.values(s.val()||{});sv('fb_products',S.products);render()}catch(e){}});
  db.child('settings').on('value',s=>{try{if(s.val()){S.set={...S.set,...s.val()};sv('fb_settings',S.set);render()}}catch(e){}});
  db.child('categories').on('value',s=>{try{const v=Object.values(s.val()||{}).sort((a,b)=>(a.order||0)-(b.order||0));S.cats=v.length?v:DEF;sv('fb_cats',S.cats);render()}catch(e){}});
  db.child('banner').on('value',s=>{try{S.bn=s.val()||{};sv('fb_banner',S.bn);render()}catch(e){}});
}

const waNum=()=>{let n=String(S.set.wa||'').replace(/\D/g,'');return n.startsWith('0')?'92'+n.slice(1):n};
const waLink=t=>`https://wa.me/${waNum()}?text=${encodeURIComponent(t)}`;
const rs=n=>'Rs '+Number(n||0).toLocaleString();
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect fill="#fce4ec" width="300" height="400"/><text x="150" y="210" font-size="60" text-anchor="middle">👗</text></svg>');

function card(p){
  return `<div class="card" data-id="${p.id}"><div class="im"><img loading="lazy" src="${esc((p.imgs||[])[0]||PH)}" alt="">
  <span class="bdg">${esc(catName(p.cat))}</span>${p.sold?'<span class="so">Sold Out</span>':''}${p.old>p.price?'<span class="so" style="top:32px;bottom:auto;background:#d81b60">SALE</span>':''}
  <button class="fv ${S.fav.includes(p.id)?'on':''}" data-f="${p.id}">♥</button></div>
  <h4>${esc(p.title)}</h4><b>${rs(p.price)}</b>${p.old>p.price?` <s style="font-size:11px;color:#999">${rs(p.old)}</s>`:''}<small>🎨 ${esc((p.colors||[]).slice(0,3).join(', '))}</small>
  <button class="btn" data-c="${p.id}" ${p.sold?'disabled style="opacity:.5"':''}>Add to Cart</button></div>`;
}
function render(){
  try {
    const cl=$('#closed'); if(cl) cl.style.display=S.set.open===false?'grid':'none';
    const b=S.bn||{},img=safe(b.img)||(b.img&&/^data:image\//.test(b.img)?esc(b.img):'');
    const bnSec=$('#bn'); if(bnSec) bnSec.innerHTML=`<div class="banner" ${img?`style="background-image:url('${img}')"`:''}><div><h2>${esc(b.head||'Welcome to Family Boutique')}</h2>${b.offer?`<p>${esc(b.offer)}</p>`:''}</div></div>`;
    
    const q=(S.q||'').toLowerCase();
    const list=(S.products||[]).filter(p=>!q||(p.title+' '+catName(p.cat)+' '+(p.colors||[]).join(' ')).toLowerCase().includes(q));
    let h=`<div class="chips">${[{id:'all',name:'All'},...S.cats].map(c=>`<span class="chip ${S.cat===c.id?'on':''}" data-cat="${esc(c.id)}">${esc(c.name)}</span>`).join('')}</div>`;
    let any=false;
    S.cats.forEach(c=>{
      if(S.cat!=='all'&&S.cat!==c.id)return;
      const items=list.filter(p=>p.cat===c.id);if(!items.length)return;any=true;
      h+=`<h2 class="t">${esc(c.name)}</h2><div class="row">${items.map(card).join('')}</div>`;
    });
    if(!any)h+='<p style="padding:30px;text-align:center;color:#8a5568">No items found.</p>';
    const mainEl=$('#main'); if(mainEl) mainEl.innerHTML=h;
    
    const s=S.set,soc=[['tt','TikTok','♪'],['fb','Facebook','f'],['ig','Instagram','◎']].filter(x=>safe(s[x[0]]));
    const ftEl=$('#ft'); if(ftEl) ftEl.innerHTML=`<div class="fbox"><h3>Family Boutique And Cloth House</h3>${s.desc?`<p>${esc(s.desc)}</p>`:''}
    ${s.addr?`<p>📍 ${esc(s.addr)}</p>`:''}${s.phone?`<p>📞 <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></p>`:''}${s.email?`<p>✉️ <a href="mailto:${esc(s.email)}">${esc(s.email)}</a></p>`:''}
    ${soc.length?`<div class="socs">${soc.map(x=>`<a class="soc" title="${x[1]}" target="_blank" rel="noopener" href="${safe(s[x[0]])}">${x[2]}</a>`).join('')}</div>`:''}</div>
    <p class="cp">© ${new Date().getFullYear()} Family Boutique And Cloth House</p>`;
  } catch(err) { console.error(err); }
}

function openM(html,lock){const m=$('#m'),mb=$('#mb'),mx=$('#mx');if(mb)mb.innerHTML=html;if(m)m.classList.add('on');if(m)m.dataset.lock=lock?1:'';if(mx)mx.style.display=lock?'none':'block'}
function close(){const m=$('#m');if(m&&m.dataset.lock)return;if(m)m.classList.remove('on')}
const mxEl=$('#mx');if(mxEl)mxEl.onclick=close;
const mEl=$('#m');if(mEl)mEl.onclick=e=>{if(e.target.id==='m')close()};

function product(id){
  const p=byId(id);if(!p)return;
  const rel=S.products.filter(x=>x.cat===p.cat&&x.id!==id).slice(0,6);
  openM(`<h3 style="margin-bottom:4px;color:#d81b60">${esc(p.title)}</h3>
  <div class="slider">${(p.imgs?.length?p.imgs:[PH]).map(i=>`<img src="${esc(i)}" alt="">`).join('')}</div>
  <div class="price">${rs(p.price)}</div>
  <p>${p.sold?'❌ Sold Out':'✅ In Stock'} · 🎨 ${esc((p.colors||[]).join(', '))}</p>
  <p style="margin:8px 0;white-space:pre-line">${esc(p.desc)}</p>
  <button class="btn full" data-c="${id}" ${p.sold?'disabled':''}>🛒 Add to Cart</button>
  <button class="btn alt full" data-f="${id}">${S.fav.includes(id)?'♥ Remove Favorite':'♡ Add to Favorites'}</button>
  <a class="btn wa full" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" data-ord="p:${id}" href="${waLink(`Hello! I want to order: ${p.title} (${rs(p.price)})`)}">Order via WhatsApp</a>
  ${rel.length?`<h3 style="margin:16px 0 0;color:#d81b60">Similar Suits</h3><div class="row" style="padding:8px 0">${rel.map(card).join('')}</div>`:''}`);
}
function cart(){
  const ids=Object.keys(S.cart).filter(id=>byId(id));let tot=0,msg='Hello! I want to order:\n';
  const rows=ids.map(id=>{const p=byId(id),n=S.cart[id];tot+=p.price*n;msg+=`• ${p.title} x${n} = ${rs(p.price*n)}\n`;
    return `<div class="line"><img src="${esc(p.imgs?.[0]||PH)}"><div>${esc(p.title)}<br><b>${rs(p.price)}</b></div>
    <button class="btn alt" data-q="${id}:-1">−</button>${n}<button class="btn alt" data-q="${id}:1">+</button></div>`}).join('');
  msg+=`Total: ${rs(tot)}`+(S.user?`\nName: ${S.user.name}\nMobile: ${S.user.mobile}`:'');
  openM(`<h3 style="color:#d81b60">🛒 Your Cart</h3>${rows||'<p style="padding:20px;text-align:center">Cart is empty</p>'}
  ${rows?`<div class="price" style="margin:10px 0">Total: ${rs(tot)}</div><a class="btn wa full" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" data-ord="cart" href="${waLink(msg)}">Checkout via WhatsApp</a>`:''}`);
}
function favs(){const l=S.products.filter(p=>S.fav.includes(p.id));
  openM(`<h3 style="color:#d81b60">❤️ Favorites</h3>${l.length?`<div class="grid" style="padding:8px 0">${l.map(card).join('')}</div>`:'<p style="padding:20px;text-align:center">No favorites yet</p>'}`)}
function profile(){openM(`<h3 style="color:#d81b60">My Profile</h3><p style="margin:10px 0">👤 ${esc(S.user?.name||'Guest')}<br>📱 ${esc(S.user?.mobile||'-')}</p><button class="btn full" id="lo">Logout</button>`)}
function help(){const s=S.set;openM(`<h3 style="color:#d81b60">Help & Support</h3><p style="white-space:pre-line;margin:8px 0">${esc(s.desc)}\n📞 ${esc(s.phone)}\n✉️ ${esc(s.email)}\n📍 ${esc(s.addr)}</p>
  <a class="btn wa full" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${waLink('Hello! I need help.')}">Chat on WhatsApp</a>`)}
function admin(){openM(`<h3 style="color:#d81b60">Family Boutique Admin</h3><input id="pw" type="password" placeholder="Admin password"><p id="pe" style="color:#d81b60"></p><button class="btn full" id="ap">Enter</button>`)}
function menu(){openM(`<div class="menu"><h3 style="color:#d81b60">Menu</h3>
  <a data-go="all">All Collections</a>${S.cats.map(c=>`<a data-go="${esc(c.id)}">${esc(c.name)}</a>`).join('')}
  <a data-v="cart">🛒 Cart (${Object.values(S.cart).reduce((a,b)=>a+b,0)})</a><a data-v="favs">❤️ Favorites</a><a data-v="profile">👤 Profile</a>
  <a target="_blank" rel="noopener" href="${waLink('Hello! I want to place an order.')}">💬 Order Now on WhatsApp</a><a data-v="help">Help / Support</a><a data-v="install">📲 Add to Home Screen</a><a data-v="admin">🔐 Family Boutique Admin</a></div>`)}

function login(){
  openM(`<h3 style="color:#d81b60">Welcome 🌸</h3><p>Sign in to continue</p>
  <input id="ln" placeholder="Your name"><input id="lm" type="tel" placeholder="03XXXXXXXXX"><p id="le" style="color:#d81b60;font-size:13px"></p>
  <button class="btn full" id="lg">Continue</button>`,true)
}
function doLogin(){
  const ln=$('#ln'), lm=$('#lm'), le=$('#le'), mEl=$('#m');
  if(!ln||!lm) return;
  const name=ln.value.trim(),raw=lm.value.replace(/[\s-]/g,'');
  const m=raw.match(/^(?:\+?92|0)(3\d{9})$/);
  if(name.length<2||!m){if(le)le.textContent='Enter your name and a valid mobile (03XXXXXXXXX).';return}
  S.user={name,mobile:'0'+m[1],joined:new Date().toISOString()};sv('fb_user',S.user);
  if(db)db.child('users/'+S.user.mobile).update(S.user).catch(console.warn);
  if(mEl)mEl.dataset.lock='';
  close();
}

function logOrder(k){
  let items=[],total=0;
  if(k==='cart'){Object.keys(S.cart).forEach(id=>{const p=byId(id);if(p){items.push({t:p.title,n:S.cart[id],pr:p.price});total+=p.price*S.cart[id]}})}
  else{const p=byId(k.slice(2));if(p){items=[{t:p.title,n:1,pr:p.price}];total=p.price}}
  if(!items.length)return;
  const o={id:'o'+Date.now(),items,total,name:S.user?.name||'',mobile:S.user?.mobile||'',ts:Date.now(),status:'new',src:k==='cart'?'cart':'product'};
  sv('fb_orders',[...ls('fb_orders',[]),o].slice(-50));
  if(db)db.child('orders/'+o.id).set(o).catch(console.warn);
}

let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
addEventListener('appinstalled',()=>{dip=null;toast('Installed 🎉')});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function install(){
  if(standalone())return openM('<h3 style="color:#d81b60">Already installed ✅</h3><p style="margin-top:8px">Family Boutique is on your home screen.</p>');
  if(dip){const p=dip;dip=null;p.prompt();p.userChoice.then(()=>close()).catch(()=>{});return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  openM(`<h3 style="color:#d81b60">📲 Add to Home Screen</h3>`+(ios
   ?`<ol class="how"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow) at the bottom.</li><li>Scroll and tap <b>Add to Home Screen</b>.</li><li>Tap <i>Add</i>.</li></ol>`
   :`<ol class="how"><li>Open the browser menu <b>⋮</b> (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Confirm with <b>Install</b>.</li></ol><p style="font-size:12px;color:#8a5568">On desktop, use the install icon in the address bar.</p>`));
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

document.addEventListener('click',e=>{
  try {
    const t=e.target,g=a=>t.closest(`[${a}]`);
    let el;
    const od=t.closest('[data-ord]');if(od)logOrder(od.dataset.ord);
    if(el=g('data-f')){const id=el.dataset.f;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];sv('fb_fav',S.fav);
      try{const m=$('#m'),mb=$('#mb');if(m&&m.classList.contains('on')&&mb.querySelector('h3')?.textContent==='❤️ Favorites')favs();else render()}catch(e){}
      if(el.classList.contains('btn'))product(id);return}
    if(el=g('data-c')){const id=el.dataset.c;S.cart[id]=(S.cart[id]||0)+1;sv('fb_cart',S.cart);toast('Added to cart 🛒');return}
    if(el=g('data-q')){const[id,d]=el.dataset.q.split(':');S.cart[id]=(S.cart[id]||0)+Number(d);if(S.cart[id]<=0)delete S.cart[id];sv('fb_cart',S.cart);cart();return}
    if(el=g('data-go')){S.cat=el.dataset.go;close();render();return}
    if(el=g('data-cat')){S.cat=el.dataset.cat;render();return}
    if(el=g('data-v')){({cart,favs,profile,help,admin,install})[el.dataset.v]();return}
    if(el=t.closest('.card')){product(el.dataset.id);return}
    if(t.id==='lg')doLogin();
    if(t.id==='lo'){localStorage.removeItem('fb_user');S.user=null;toast('Logged out');profile();login()}
    if(t.id==='ap'){const pw=$('#pw'), pe=$('#pe');if(pw&&pw.value===String(S.set.pass||'6907')){try{sessionStorage.setItem('fb_admin','1')}catch{}location.href='admin.html'}else if(pe)pe.textContent='Wrong password'}
  } catch(err){console.error(err)}
});
const hamEl=$('#ham');if(hamEl)hamEl.onclick=menu;
const qEl=$('#q');if(qEl)qEl.oninput=e=>{S.q=e.target.value;render()};
const logoEl=$('#logo');if(logoEl)logoEl.onclick=()=>scrollTo({top:0,behavior:'smooth'});

render();
if(!S.user)login();
</script>
</body></html>
